[project]
name = "clevin-runtime"
version = "0.1.0"
description = "Minimal Modal runtime and terminal client for Clevin"
requires-python = ">=3.13"
dependencies = [
    "anthropic[webhooks]==0.125.0",
    "fastapi==0.136.1",
    "httpx==0.28.1",
    "modal==1.4.3",
    "python-dotenv==1.2.2",
    "rich==15.0.0",
    "standardwebhooks==1.0.1",
]

[project.scripts]
clevin = "clevin_runtime.client:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clevin_runtime"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
# The workstream fixtures under experiments/ are intentionally red until an
# agent fixes them; they are run by their own CI check, not by this suite.
norecursedirs = ["experiments"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["clevin_runtime"]

[dependency-groups]
dev = [
    "mypy==1.17.1",
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "ruff==0.12.11",
]
